<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#56d364"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#da3633"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#e3b341"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="318" rx="11" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Decorative code lines (background texture) -->
  <g opacity="0.06" fill="#c9d1d9" font-family="monospace" font-size="11">
    <text x="20" y="30">const audit = await analyzeRepo(files, { depth: 'DEEP' });</text>
    <text x="20" y="48">for (const file of inventory) { classify(file); }</text>
    <text x="20" y="66">if (realness &lt; 0.3) findings.push({ severity: 'CRITICAL' });</text>
    <text x="520" y="30">fn hnsw_search(query: &amp;[f32]) -&gt; Vec&lt;Neighbor&gt;</text>
    <text x="520" y="48">let fisher = ewc_plus_plus(&amp;params, &amp;data);</text>
    <text x="520" y="66">pub struct ReasoningBank { db: SqlitePool }</text>
    <text x="20" y="274">SELECT severity, COUNT(*) FROM findings GROUP BY severity;</text>
    <text x="20" y="292">-- 12,734 findings | 1,696 files DEEP | 17 domains</text>
    <text x="520" y="274">assert_eq!(facade.real_code_lines(), 0);</text>
    <text x="520" y="292">// "150x-12,500x" → marketing, not measurement</text>
  </g>

  <!-- Magnifying glass icon -->
  <g transform="translate(60, 120)" filter="url(#glow)">
    <circle cx="38" cy="38" r="32" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.8"/>
    <line x1="62" y1="62" x2="82" y2="82" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <!-- Code lines inside lens -->
    <g opacity="0.5" font-family="monospace" font-size="8" fill="#58a6ff">
      <text x="16" y="28">fn real()</text>
      <text x="14" y="38" fill="#56d364">  true</text>
      <text x="14" y="48" fill="#f85149">  facade</text>
    </g>
  </g>

  <!-- Title -->
  <text x="170" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#c9d1d9" letter-spacing="-0.5">ruvnet-research</text>
  <text x="170" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#8b949e">A forensic audit of 5.5M lines across 4 repositories</text>

  <!-- Divider -->
  <line x1="170" y1="180" x2="520" y2="180" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>

  <!-- Stats row -->
  <g transform="translate(170, 200)" font-family="system-ui, -apple-system, sans-serif">
    <!-- Files read -->
    <text font-size="28" font-weight="700" fill="url(#accent)">1,696</text>
    <text y="18" font-size="11" fill="#8b949e">files read DEEP</text>

    <!-- Findings -->
    <g transform="translate(150, 0)">
      <text font-size="28" font-weight="700" fill="url(#accent)">12,734</text>
      <text y="18" font-size="11" fill="#8b949e">findings recorded</text>
    </g>

    <!-- Domains -->
    <g transform="translate(320, 0)">
      <text font-size="28" font-weight="700" fill="url(#accent)">17</text>
      <text y="18" font-size="11" fill="#8b949e">domains analyzed</text>
    </g>

    <!-- Sessions -->
    <g transform="translate(430, 0)">
      <text font-size="28" font-weight="700" fill="url(#accent)">140</text>
      <text y="18" font-size="11" fill="#8b949e">research sessions</text>
    </g>
  </g>

  <!-- Verdict bars (right side) -->
  <g transform="translate(640, 105)" font-family="system-ui, -apple-system, sans-serif">
    <text font-size="11" font-weight="600" fill="#8b949e" letter-spacing="1">VERDICT SPECTRUM</text>

    <!-- Genuine -->
    <g transform="translate(0, 24)">
      <rect width="180" height="6" rx="3" fill="#21262d"/>
      <rect width="140" height="6" rx="3" fill="url(#green)"/>
      <text x="190" y="8" font-size="11" fill="#56d364">Genuine</text>
    </g>

    <!-- Partial -->
    <g transform="translate(0, 48)">
      <rect width="180" height="6" rx="3" fill="#21262d"/>
      <rect width="95" height="6" rx="3" fill="url(#yellow)"/>
      <text x="190" y="8" font-size="11" fill="#e3b341">Partial</text>
    </g>

    <!-- Facade -->
    <g transform="translate(0, 72)">
      <rect width="180" height="6" rx="3" fill="#21262d"/>
      <rect width="60" height="6" rx="3" fill="url(#red)"/>
      <text x="190" y="8" font-size="11" fill="#f85149">Facade</text>
    </g>

    <!-- Legend text -->
    <text y="105" font-size="10" fill="#484f58">ReasoningBank, HNSW, EWC++ = real</text>
    <text y="120" font-size="10" fill="#484f58">9 RL algorithms, Byzantine = facade</text>
  </g>
</svg>
